name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-level default is read-only; only the deploy job (below) is
# granted the elevated pages/id-token permissions it actually needs - the
# build job never gets them, so a compromised dependency's install/build
# script couldn't call the Pages deploy API even if it tried.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint + typecheck + tests (do not deploy something CI wouldn't pass)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # index.html/styles.css reference "dist/main.js", "sw.js", and
      # "assets/fonts/..." with paths only correct when index.html sits at
      # the repo root next to dist/, sw.js, and assets/ (the local-dev
      # layout). sw.js MUST sit at the site root, not under dist/ - see
      # src/sw.ts's header comment for why (a service worker's own script
      # location caps the max scope it can control; GitHub Pages can't set
      # the Service-Worker-Allowed header that would otherwise be needed).
      # Stage a site/ folder that reproduces the local-dev layout exactly,
      # so no path needs to change between local dev and the deployed site.
      - name: Assemble static site (site/index.html + site/styles.css + site/sw.js + site/dist/** + site/assets/**)
        run: |
          mkdir -p site
          cp index.html styles.css sw.js site/
          cp -r dist site/dist
          cp -r assets site/assets

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
