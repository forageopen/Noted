name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + tests (do not deploy something CI wouldn't pass)
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # index.html/styles.css reference "dist/main.js", "sw.js", and
      # "assets/fonts/..." with paths only correct when index.html sits at
      # the repo root next to dist/, sw.js, and assets/ (the local-dev
      # layout). sw.js MUST sit at the site root, not under dist/ - see
      # src/sw.ts's header comment for why (a service worker's own script
      # location caps the max scope it can control; GitHub Pages can't set
      # the Service-Worker-Allowed header that would otherwise be needed).
      # Stage a site/ folder that reproduces the local-dev layout exactly,
      # so no path needs to change between local dev and the deployed site.
      - name: Assemble static site (site/index.html + site/styles.css + site/sw.js + site/dist/** + site/assets/**)
        run: |
          mkdir -p site
          cp index.html styles.css sw.js site/
          cp -r dist site/dist
          cp -r assets site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
