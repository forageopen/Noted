name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + tests (do not deploy something CI wouldn't pass)
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # index.html/styles.css reference "dist/main.js" and
      # "assets/fonts/..." with paths only correct when index.html sits at
      # the repo root next to dist/ and assets/ (the local-dev layout).
      # Stage a site/ folder that reproduces that layout exactly, so no
      # path needs to change between local dev and the deployed site.
      - name: Assemble static site (site/index.html + site/styles.css + site/dist/** + site/assets/**)
        run: |
          mkdir -p site
          cp index.html styles.css site/
          cp -r dist site/dist
          cp -r assets site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
