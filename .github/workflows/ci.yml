name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this job only checks out code and runs
# typecheck/tests, so it needs nothing beyond read access - explicit rather
# than relying on whatever the repo/org's ambient default token permissions
# happen to be.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict mode)
        run: npm run typecheck

      - name: Unit tests
        run: npm test
