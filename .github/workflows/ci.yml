name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this job only checks out code and runs
# typecheck/tests, so it needs nothing beyond read access - explicit rather
# than relying on whatever the repo/org's ambient default token permissions
# happen to be.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict mode)
        run: npm run typecheck

      - name: Unit tests
        run: npm test
